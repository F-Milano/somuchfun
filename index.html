<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================
         BASIC PAGE SETTINGS
         ========================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>So Much Fun</title>


    <!-- =========================================
         PRELOAD CUSTOM FONT

         This tells the browser to start downloading
         the Dark Spikes font immediately.

         This is especially useful on smartphones.
         ========================================= -->

    <link
        rel="preload"
        href="fonts/Dark Spikes.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >


    <!-- =========================================
         STYLESHEET

         ?v=4 helps prevent the browser from using
         an old cached version during development.
         ========================================= -->

    <link
        rel="stylesheet"
        href="style.css?v=4"
    >

</head>


<body>


    <!-- =========================================
         CENTRAL TITLE / ABOUT LINK

         Clicking "SO MUCH FUN" will eventually
         open the About page.
         ========================================= -->

    <a
        id="about-link"
        href="about.html"
    >
        SO MUCH FUN
    </a>



    <!-- =========================================
         PROJECT CANVAS

         Each project consists of:
         - a link to its project page
         - an image used as the homepage icon

         JavaScript positions these randomly.
         ========================================= -->

    <main id="canvas">


        <!-- CIABOT MONTEBELLINA -->

        <a
            class="project"
            href="projects/ciabot-montebellina.html"
        >
            <img
                src="images/CiabotMontebellina.webp"
                alt="Ciabot Montebellina"
            >
        </a>



        <!-- FURETZU -->

        <a
            class="project"
            href="projects/furetzu.html"
        >
            <img
                src="images/furetzu.webp"
                alt="Furetzu"
            >
        </a>



        <!-- SMART PASTA -->

        <a
            class="project"
            href="projects/smart-pasta.html"
        >
            <img
                src="images/smartPasta.webp"
                alt="Smart Pasta"
            >
        </a>


    </main>



    <!-- =========================================
         JAVASCRIPT

         Handles:
         - random project positions
         - dragging
         - screen boundaries
         - responsive repositioning

         ?v=4 prevents an older cached script
         from being used during development.
         ========================================= -->

    <script src="script.js?v=4"></script>


</body>

</html>
