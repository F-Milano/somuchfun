<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>So Much Fun</title>


    <!-- ======================================================
         CUSTOM FONT
         ====================================================== -->

    <link
        rel="preload"
        href="fonts/Dark Spikes.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >


    <!-- ======================================================
         STYLESHEET
         ======================================================

         The version number helps prevent browser caching
         while we are developing the website.
    -->

    <link rel="stylesheet" href="style.css?v=7">

</head>


<body>


    <!-- ======================================================
         CENTRAL TITLE / ABOUT
         ====================================================== -->

    <a id="about-link" href="about.html">
        SO MUCH FUN
    </a>



    <!-- ======================================================
         PROJECT CANVAS
         ======================================================

         Project icons are generated automatically by
         script.js using the projects listed in:

         /projects/projects.js
    -->

    <main id="canvas"></main>



    <!-- ======================================================
         PROJECT OVERLAY
         ======================================================

         Hidden by default.

         When a project icon is clicked, JavaScript will
         display this window and fill it with the selected
         project's information and images.

         Navigation structure:

         INFO → IMAGE 1 → IMAGE 2 → IMAGE 3 → ...
    -->

    <div
        id="project-overlay"
        aria-hidden="true"
    >

        <div id="project-window">


            <!-- ==================================================
                 CLOSE BUTTON
                 ================================================== -->

            <button
                id="project-close"
                type="button"
                aria-label="Close project"
            >
                ×
            </button>



            <!-- ==================================================
                 PREVIOUS SLIDE
                 ================================================== -->

            <button
                id="project-prev"
                type="button"
                aria-label="Previous slide"
            >
                &lt;
            </button>



            <!-- ==================================================
                 PROJECT CONTENT
                 ==================================================

                 JavaScript inserts either:

                 - project information
                 - project image

                 inside this container.
            -->

            <div id="project-content"></div>



            <!-- ==================================================
                 NEXT SLIDE
                 ================================================== -->

            <button
                id="project-next"
                type="button"
                aria-label="Next slide"
            >
                &gt;
            </button>


        </div>

    </div>



    <!-- ======================================================
         JAVASCRIPT
         ======================================================

         type="module" allows script.js to import the
         individual project files.
    -->

    <script
        type="module"
        src="script.js?v=8"
    ></script>


</body>

</html>
