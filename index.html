<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>So Much Fun</title>

    <!--
        Preload the custom font so the central title
        can appear as quickly as possible.
    -->
    <link
        rel="preload"
        href="fonts/Dark Spikes.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >

    <!--
        Increase the version number when we make major
        CSS changes. This helps avoid browser caching.
    -->
    <link rel="stylesheet" href="style.css?v=7">
</head>


<body>

    <!-- ======================================================
         CENTRAL TITLE
         ====================================================== -->

    <a id="about-link" href="about.html">
        SO MUCH FUN
    </a>


    <!-- ======================================================
         PROJECT CANVAS
         ======================================================

         The project icons are NOT written here manually anymore.

         script.js will read the project list from:
         /projects/projects.js

         and automatically create the project icons here.
    -->

    <main id="canvas"></main>

      >
            &lt;
        </button>


        <!-- Project content -->
        <div id="project-content"></div>


        <!-- Next slide -->
        <button
            id="project-next"
            type="button"
            aria-label="Next slide"
        >
            &gt;
        </button>

    </div>

</div>


    <!-- ======================================================
         JAVASCRIPT
         ======================================================

         type="module" allows script.js to import our
         individual project files.
    -->

    <script
        type="module"
        src="script.js?v=7"
    ></script>

</body>

</html>
