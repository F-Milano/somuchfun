<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>So Much Fun</title>


    <!-- ======================================================
         CUSTOM FONT
         ====================================================== -->

    <link
        rel="preload"
        href="fonts/Dark Spikes.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >


    <!-- ======================================================
         STYLESHEET
         ======================================================

         The version number helps prevent browser caching
         while we are developing the website.
    -->

    <link rel="stylesheet" href="style.css?v=32">

</head>


<body>


    <!-- ======================================================
         CENTRAL TITLE / ABOUT
         ====================================================== -->

    <section id="introduction" aria-label="About Francesco Milano">
        <a id="about-link" href="#about" aria-expanded="false" aria-controls="about-text">Francesco Milano</a>
        <!-- Replace this placeholder with your biography. -->
        <span id="about-text" hidden>is an architect who graduated…</span>
        <a id="back-to-projects" href="#" hidden>Back to projects</a>
    </section>



    <!-- ======================================================
         PROJECT CANVAS
         ======================================================

         Project icons are generated automatically by
         script.js using the projects listed in:

         /projects/projects.js
    -->

    <main id="canvas"></main>



    <!-- ======================================================
         PROJECT OVERLAY
         ======================================================

         Hidden by default.
         

         When a project icon is clicked, JavaScript will
         display this window and fill it with the selected
         project's information and images.

         One continuous project page scrolls inside the fixed window.
    -->

    <div
        id="project-overlay"
        aria-hidden="true"
    >

        <div id="project-window">


            <!-- ==================================================
                 CLOSE BUTTON
                 ================================================== -->

            <button
                id="project-close"
                type="button"
                aria-label="Close project"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M5 5L19 19M19 5L5 19" />
                </svg>
            </button>






            <!-- ==================================================
                 PROJECT CONTENT
                 ==================================================

                 JavaScript inserts the complete project page here.
            -->

            <div id="project-content"></div>





        </div>

    </div>



    <!-- ======================================================
         JAVASCRIPT
         ======================================================

         type="module" allows script.js to import the
         individual project files.
    -->

    <script
        type="module"
        src="script.js?v=24"
    ></script>


</body>

</html>
